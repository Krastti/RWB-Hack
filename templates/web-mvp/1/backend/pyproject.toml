[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "generated-project"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi==0.162.0", "uvicorn==0.54.0", "pydantic-settings==2.16.2", "SQLAlchemy==2.0.55", "psycopg[binary]==3.3.6", "alembic==1.20.1", "PyJWT==2.15.1", "httpx==0.28.1"]
[tool.setuptools.packages.find]
include = ["app*"]
