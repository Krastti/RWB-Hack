name: Profile tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  profile-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements-test.txt
            backend/app/agents/profiles/requirements.txt
            contracts/agents/requirements.txt
      - run: python -m pip install -r backend/requirements-test.txt
      - run: python -m pytest backend/tests/test_profile_review.py -v
        env:
          PYTHONPATH: backend:.
