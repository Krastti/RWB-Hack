name: Profile tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  web-mvp:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rwb_test
          POSTGRES_PASSWORD: rwb_test
          POSTGRES_DB: rwb_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rwb_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PYTHONPATH: backend:.
      RWB_TEST_DATABASE_URL: postgresql+psycopg://rwb_test:rwb_test@localhost:5432/rwb_test
      RWB_MVP_EXPORT_DIR: ${{ runner.temp }}/rwb-product
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r backend/requirements-worker.txt -r backend/requirements-test.txt
      - run: >-
          python -m pytest backend/tests/test_pipeline_mvp.py backend/tests/test_pipeline_active_time.py
          backend/tests/test_pipeline_policies.py backend/tests/test_pipeline_policy_postgresql.py
          backend/tests/test_mvp_generated_product.py backend/tests/test_pipeline_execution.py
          backend/tests/test_pipeline_review_regressions.py backend/tests/test_artifact_persistence.py -q
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm ci
        working-directory: ${{ runner.temp }}/rwb-product/frontend
      - run: npm run build
        working-directory: ${{ runner.temp }}/rwb-product/frontend

  profile-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements-test.txt
            backend/app/agents/profiles/requirements.txt
            contracts/agents/requirements.txt
            backend/app/agents/generation/requirements.txt
            backend/app/agents/llm/requirements.txt

      - run: python -m pip install -r backend/requirements-test.txt -r backend/app/agents/generation/requirements.txt

      - run: python -m pytest backend/tests/test_profile_review.py backend/tests/test_behavior_model.py -v
        env:
          PYTHONPATH: backend:.

      - run: python -m pytest backend/tests/test_context_review.py contracts/agents/test_validate.py -v
        env:
          PYTHONPATH: backend:.

      - run: python -m unittest backend.app.agents.generation.tests.test_executor -v
        env:
          PYTHONPATH: backend:.

  architecture-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: python -m pip install -r backend/requirements-worker.txt -r backend/requirements-test.txt

      - run: python -m pytest backend/tests/test_architecture_stage.py -v
        env:
          PYTHONPATH: backend:.
