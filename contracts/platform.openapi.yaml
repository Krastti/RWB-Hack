        run_id: *id001
        snapshot_id: *id001
        status:
          type: string
          enum:
          - queued
          - running
          - completed
          - failed
        repository_url:
          type: string
          format: uri
        commit_sha:
          type: string
          pattern: ^[a-f0-9]{40,64}$
        error:
