      required:
      - items
      - next_cursor
    RunPage:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Run'
        next_cursor:
          type:
          - string
          - 'null'
      required:
      - items
      - next_cursor
  parameters:
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 100
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
        minLength: 1
      description: Непрозрачный курсор; отсутствие начинает список. Неверный или чужой
        контекст — 422.
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: ^[A-Za-z0-9._:-]+$
      description: 'Область: owner + operation + resource + key. То же нормализованное
        JSON-тело возвращает исходные статус и тело, иное — 409 IDEMPOTENCY_KEY_CONFLICT;
        параллельный запрос до фиксации — 409 IDEMPOTENCY_IN_PROGRESS. Успешные результаты
        хранятся весь срок ресурса; ошибки валидации ключ не резервируют.'
  responses:
    Error:
      description: 'Единая ошибка: 401 UNAUTHORIZED (включая истёкший JWT/неверный
        пароль); 404 NOT_FOUND; 409 RUN_STATE_CONFLICT / STALE_QUESTIONS_REVISION
        / IDEMPOTENCY_KEY_CONFLICT / IDEMPOTENCY_IN_PROGRESS / SNAPSHOT_NOT_READY;
        422 VALIDATION_ERROR; 429 RATE_LIMIT_EXCEEDED; 500 INTERNAL_ERROR. details
        не содержит секретов. При 429 Retry-After задаёт секунды.'
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
          description: Только для 429.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: RUN_STATE_CONFLICT
              message: Запуск не ожидает ответов
              details: {}
              request_id: req-example-1

# Retry budget policy: stop_reason MAX_CALLS/MAX_OUTPUT_TOKENS permits only an
# authorized sufficient increase of the exhausted limit. MAX_INPUT_TOKENS,
# RUN_TIMEOUT (active execution time), and unknown causes return 409
# RETRY_NOT_SUPPORTED without effects. duration_ms is elapsed wall-clock time,
# not active execution time. See C-03 and C-05 for the same policy.
